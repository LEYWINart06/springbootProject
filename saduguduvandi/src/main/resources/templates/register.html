<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sadugudu Vandi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="brand"><a th:href="@{/}">SADUGUDU <span>VANDI</span></a></div>
    <div class="nav-links" style="display:flex;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/vehicles}">Vehicles</a>
    </div>
</nav>

<div class="auth-wrap">
    <h1>Create Account</h1>
    <p class="subtitle">Join Sadugudu Vandi and start your journey</p>

    <div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-block">Register</button>
    </form>

    <div class="form-footer">
        Already have an account? <a th:href="@{/login}">Login</a>
    </div>
</div>

<footer>
    &copy; 2026 Sadugudu Vandi. Built as a student project.
</footer>

</body>
</html>
