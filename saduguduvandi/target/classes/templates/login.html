<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sadugudu Vandi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="brand"><a th:href="@{/}">SADUGUDU <span>VANDI</span></a></div>
    <div class="nav-links" style="display:flex;">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/vehicles}">Vehicles</a>
    </div>
</nav>

<div class="auth-wrap">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to continue booking your ride</p>

    <div class="alert alert-success" th:if="${param.registered != null}">
        Registration successful. Please login.
    </div>
    <div class="alert alert-success" th:if="${param.logout != null}">
        You have been logged out.
    </div>
    <div class="alert alert-error" th:if="${param.error != null}">
        Invalid email or password.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-block">Login</button>
    </form>

    <div class="form-footer">
        Don't have an account? <a th:href="@{/register}">Register</a>
    </div>
</div>

<footer>
    &copy; 2026 Sadugudu Vandi. Built as a student project.
</footer>

</body>
</html>
